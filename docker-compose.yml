services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peerreview
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/sql/migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Express Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/peerreview
      JWT_SECRET: ${JWT_SECRET:-db1998037902163adba7f7d4744a667ea8755d1a646ca46e7288498073cd96a32e4fa131f098298505bb7bf3a40749eb1ab35b635148816cf1069b1647499d4e}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.peer.review.uconn.edu}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.peer.review.uconn.edu,http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:5001
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── AI Service (Flask / OpenAI) ───────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/peerreview
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PORT: "5001"
      FLASK_DEBUG: "0"
      FRONTEND_URL: ${FRONTEND_URL:-https://www.peer.review.uconn.edu}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── React Frontend (nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata: {}
  backend_uploads: {}
