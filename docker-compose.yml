services:

  # ── PostgreSQL ─────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: peerreview
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/sql/migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Expose only if you need direct DB access from host (e.g. pgAdmin)
    # ports:
    #   - "5432:5432"

  # ── Backend (Express / TypeScript) ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/peerreview
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      NODE_ENV: production
      PORT: 8080
      # Must match the URL users browse to (used for CORS & CAS callback)
      FRONTEND_URL: ${APP_URL:-http://localhost}
      BACKEND_URL: ${APP_URL:-http://localhost}
      CAS_BASE_URL: ${CAS_BASE_URL:-https://login.uconn.edu/cas}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose only if you need direct backend access from host
    # ports:
    #   - "8080:8080"

  # ── AI Service (Python / Flask) ────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/peerreview
      FRONTEND_URL: ${APP_URL:-http://localhost}
      AI_PORT: 5001
      FLASK_DEBUG: "0"
    # ports:
    #   - "5001:5001"

  # ── Frontend (React → nginx) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  dbdata: {}
  uploads: {}
