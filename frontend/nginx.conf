server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /auth       { proxy_pass http://backend:8080; }
    location /submissions { proxy_pass http://backend:8080; }
    location /reviews    { proxy_pass http://backend:8080; }
    location /instructor { proxy_pass http://backend:8080; }
    location /peer-review { proxy_pass http://backend:8080; }
    location /uploads    { proxy_pass http://backend:8080; }
    location /healthz    { proxy_pass http://backend:8080; }
    location /checkins   { proxy_pass http://backend:8080; }
    location /enrollments { proxy_pass http://backend:8080; }
    location /api/ai     { proxy_pass http://backend:8080; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
