server {
    listen 80;
    server_name www.peer.review.uconn.edu;
    root /usr/share/nginx/html;
    index index.html;

    # ── Uncomment below for HTTPS (place certs in /etc/nginx/ssl/) ──
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # # Redirect HTTP → HTTPS
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # SPA: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /auth          { proxy_pass http://backend:8080; }
    location /submissions   { proxy_pass http://backend:8080; }
    location /reviews       { proxy_pass http://backend:8080; }
    location /instructor    { proxy_pass http://backend:8080; }
    location /peer-review   { proxy_pass http://backend:8080; }
    location /uploads       { proxy_pass http://backend:8080; }
    location /healthz       { proxy_pass http://backend:8080; }
    location /checkins      { proxy_pass http://backend:8080; }
    location /enrollments   { proxy_pass http://backend:8080; }
    location /api/ai        { proxy_pass http://backend:8080; }
    location /notifications { proxy_pass http://backend:8080; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
